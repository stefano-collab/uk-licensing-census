<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The UK Licensing Landscape - StudioCanal</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* client: studiocanal · donor: freckle.io EXACT (live extraction, BRAND-NOTES.md) · PRODUCTION SHELL
   sticky translucent header · hero flush to header · sectioned bands with gutter gaps between them */
:root{
  --bg:#fdfdfc; --surface:#fafaf9; --card:#ffffff; --line:#e7e5e4; --frame:#ffffff;
  --ink:#0c0a09; --stone:#57534e; --mid:#78716c; --faint:#a8a29e;
  --indigo:#6366f1; --indigo-deep:#4f46e5; --blue:#2563eb; --orange:#ea580c;
  --or100:#ffedd5; --bl100:#dbeafe; --in100:#e0e7ff; --gr100:#d5f1d0; --green:#15803d;
  --dot:#eae8e3; --litbg:#ffedd5; --litline:#fdba74; --litink:#9a3412;
  --hdr:rgba(253,253,252,.82);
}
body.dark{
  --bg:#141210; --surface:#1a1816; --card:#1e1c19; --line:#2e2b27; --frame:#191714;
  --ink:#f5f4f2; --stone:#c8c4bd; --mid:#a09a90; --faint:#6f6a62;
  --dot:#252220; --litbg:#3a2415; --litline:#7c3a12; --litink:#fdba74;
  --in100:#312e81; --indigo-deep:#a5b4fc; --green:#4ade80; --hdr:rgba(20,18,16,.82);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);
     font:400 14px/1.55 "Geist",system-ui,sans-serif;
     background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);
     background-size:14px 14px;transition:background-color .3s}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
/* sticky translucent header */
header{position:sticky;top:0;z-index:40;background:var(--hdr);
       backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
       border-bottom:1px solid var(--line)}
.tb{max-width:1080px;margin:0 auto;padding:15px 44px;display:flex;
    justify-content:space-between;align-items:center}
.logoimg{height:20px;display:block}
body.dark .logoimg{filter:invert(1)}
.tb .right{display:flex;gap:20px;align-items:center}
.ghost{font:400 14px "Geist",sans-serif;color:var(--stone);cursor:pointer;transition:.15s}
.ghost:hover{color:var(--ink)}
.pill{font:500 12.5px "Geist Mono",monospace;color:var(--indigo-deep);border:1px solid var(--line);
      border-radius:10px;padding:8px 14px;background:var(--card);box-shadow:0 1px 2px #0c0a090d}
.cta{font:500 14px "Geist",sans-serif;background:var(--indigo);color:#fff;border:0;
     border-radius:9px;padding:10px 18px;cursor:pointer;transition:background .15s}
.cta:hover{background:#4f46e5}
/* sectioned bands: full-width rules, framed column, dotted gaps between */
.band{border-bottom:1px solid var(--line)}
.band+.band{border-top:1px solid var(--line);margin-top:34px}
.band:first-of-type{border-top:none;margin-top:0}
.col{max-width:1080px;margin:0 auto;background:var(--frame);
     border-left:1px solid var(--line);border-right:1px solid var(--line);
     padding:38px 44px 34px;position:relative}
.col::before,.col::after{color:#c9c5bd;font:400 12px/9px "Geist Mono",monospace;
     position:absolute;top:-5px;content:"+"}
.col::before{left:-4px}.col::after{right:-4px}
/* hero */
.hero{max-width:60ch}
.kick{font:500 11px "Geist Mono",monospace;letter-spacing:1.4px;text-transform:uppercase;
      color:var(--orange);margin-bottom:14px}
h1{font-size:38px;font-weight:500;letter-spacing:-.8px;line-height:1.18;margin-bottom:12px}
.hero p{font-size:15px;color:var(--stone)}
/* ask bar (sticky below header) */
.askwrap{position:sticky;top:57px;z-index:30;padding:12px 0 6px;margin:16px 0 4px;
         background:linear-gradient(var(--frame) 80%,transparent)}
.ask{background:var(--card);border:1px solid var(--line);border-radius:10px;
     box-shadow:0 1px 2px #0c0a0910;padding:9px;display:flex;gap:8px;align-items:center;
     transition:box-shadow .2s,border-color .2s;position:relative;overflow:hidden}
.ask.on{border-color:#c7d2fe;box-shadow:0 0 0 3px #e0e7ff55}
.qprefix{font:500 12px "Geist Mono",monospace;color:var(--faint);padding-left:8px;
         letter-spacing:.5px;user-select:none}
.ask input{flex:1;font:400 14.5px "Geist",sans-serif;border:0;outline:none;
           padding:7px 6px;color:var(--ink);background:transparent}
.ask input::placeholder{color:var(--faint)}
.ask button{font:500 13px "Geist Mono",monospace;background:var(--indigo);color:#fff;
            border:0;border-radius:8px;padding:10px 18px;cursor:pointer;min-width:96px;
            transition:background .15s}
.ask button:hover,.ask button:disabled{background:#4f46e5}
.sweep{position:absolute;left:0;bottom:0;height:2px;width:0;
       background:linear-gradient(90deg,var(--indigo),var(--orange))}
.sweep.go{width:100%;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font:500 12px "Geist Mono",monospace;border:1px solid var(--line);background:var(--card);
      color:var(--stone);border-radius:8px;padding:6px 12px;cursor:pointer;transition:.15s}
.chip:hover{border-color:#c7d2fe;color:var(--indigo-deep)}
.chip.reset{color:var(--faint)}
.status{min-height:22px;font:500 12px "Geist Mono",monospace;color:var(--mid);margin:8px 2px 0}
.status .ok{color:var(--green)}
.status .cursor::after{content:"▌";animation:blink .8s step-end infinite;color:var(--faint)}
@keyframes blink{50%{opacity:0}}
/* report */
.viewhead{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.viewhead h2{font-size:19px;font-weight:500;letter-spacing:-.4px}
.viewpill{font:500 10.5px "Geist Mono",monospace;letter-spacing:.6px;text-transform:uppercase;
          background:var(--in100);color:var(--indigo-deep);border-radius:6px;padding:4px 9px}
#stage{transition:opacity .14s ease-out}
#stage.out{opacity:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;
     padding:15px 16px 12px;opacity:0;transform:translateY(7px);position:relative}
.kpi.in{opacity:1;transform:none;transition:opacity .28s ease-out,transform .28s ease-out,box-shadow .3s}
.kpi.hot{box-shadow:0 0 0 2px #c7d2fe66,0 2px 4px #0c0a091f;border-color:transparent}
.kpi .n{font:500 22px "Geist Mono",monospace;letter-spacing:-.5px}
.kpi.hot .n{color:var(--indigo-deep)}
.kpi .l{font:500 10.5px "Geist Mono",monospace;letter-spacing:.6px;text-transform:uppercase;
        color:var(--mid);margin-top:6px}
.kpi[data-prov]{cursor:help}
.kpi[data-prov]:hover::after{content:attr(data-prov);position:absolute;left:8px;right:8px;
  bottom:calc(100% + 7px);background:var(--ink);color:var(--bg);border-radius:8px;
  padding:8px 11px;font:500 10.5px/1.5 "Geist Mono",monospace;z-index:8;
  box-shadow:0 6px 18px #0c0a0933;letter-spacing:0;text-transform:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px 19px}
.panel h3{font-size:13.5px;font-weight:500;margin-bottom:13px}
.panel h3 span{color:var(--faint);font-weight:400}
.row{display:grid;grid-template-columns:16px 132px 1fr 40px;gap:10px;align-items:center;
     margin-bottom:9px;border-radius:8px;padding:3px 6px;opacity:0;transform:translateY(6px);
     cursor:pointer}
.row.in{opacity:1;transform:none;transition:opacity .26s ease-out,transform .26s ease-out,background .3s}
.node{width:14px;height:14px;border-radius:4px;border:1px solid #0c0a0914}
.row .c{font-size:12.5px;color:var(--stone)}
.row .t{height:11px;display:flex;background:var(--surface);border-radius:4px;overflow:hidden}
.row .a{background:var(--blue);height:100%;opacity:.85}
.row .k{background:var(--bl100);height:100%}
body.dark .row .k{background:#1e3a5f}
.row .v{font:500 12.5px "Geist Mono",monospace;text-align:right}
.row.zero .c,.row.zero .v{color:var(--faint)}
.row.lit{background:var(--litbg);box-shadow:inset 0 0 0 1px var(--litline)}
.row.lit .c,.row.lit .v{color:var(--litink);font-weight:500}
.row.lit2{box-shadow:inset 0 0 0 1px var(--litline)}
.row.lit2 .c{color:var(--litink)}
.row.fade{opacity:.3}
.duelwrap{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-bottom:12px}
.duelwrap.single{grid-template-columns:1fr}
.duel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;
      opacity:0;transform:translateY(7px)}
.duel.in{opacity:1;transform:none;transition:.3s ease-out}
.duel .dn2{font:500 12px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.8px;
           color:var(--mid);margin-bottom:8px}
.duel .dv{font:500 34px "Geist Mono",monospace;letter-spacing:-1px;margin-bottom:12px}
.duel .db{height:12px;display:flex;background:var(--surface);border-radius:4px;overflow:hidden;
          margin-bottom:8px}
.duel .db .a{background:var(--blue);opacity:.85}.duel .db .k{background:var(--bl100)}
.duel .note{font-size:12.5px;color:var(--stone);line-height:1.55}
.vs{align-self:center;font:500 13px "Geist Mono",monospace;color:var(--faint);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
.mixband{margin-bottom:12px}
.legend{display:flex;gap:18px;margin:2px 4px 14px;font:500 11px "Geist Mono",monospace;
        color:var(--mid);text-transform:uppercase;letter-spacing:.5px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.insight{background:var(--surface);border:1px solid var(--line);border-radius:12px;
         padding:15px 19px;margin-bottom:4px;opacity:0;transform:translateY(6px)}
.insight.in{opacity:1;transform:none;transition:.3s ease-out}
.insight .t{font-size:13.5px;font-weight:500;margin-bottom:4px}
.insight .b{font-size:13px;color:var(--stone);max-width:94ch}
/* hotspots */
.hs{display:inline-block;font:500 11px "Geist Mono",monospace;color:var(--orange);
    cursor:help;position:relative;margin-left:7px;border:1px solid var(--litline);
    border-radius:4px;width:15px;height:15px;line-height:13px;text-align:center;vertical-align:2px}
.hs:hover::after{content:attr(data-note);position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(100% + 7px);background:var(--ink);color:var(--bg);border-radius:8px;
    padding:7px 11px;font:500 10.5px/1.5 "Geist Mono",monospace;width:250px;z-index:8;
    box-shadow:0 6px 18px #0c0a0933;text-transform:none;letter-spacing:0}
footer{max-width:1080px;margin:0 auto;padding:18px 44px 26px;font-size:11.5px;line-height:1.65;
       color:var(--faint)}
footer b{color:var(--mid)}
/* evidence drawer */
.scrim{position:fixed;inset:0;background:#0c0a0926;z-index:45;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-410px;width:390px;height:100%;background:var(--card);
        border-left:1px solid var(--line);box-shadow:-12px 0 32px #0c0a0918;z-index:50;
        transition:right .28s cubic-bezier(.2,.7,.3,1);display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer .dh{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;
            justify-content:space-between;align-items:center}
.drawer .dh b{font:500 14px "Geist",sans-serif}
.drawer .dh .x{cursor:pointer;font:500 11px "Geist Mono",monospace;color:var(--faint);
               border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.drawer .dsub{padding:10px 20px 0;font:500 10.5px "Geist Mono",monospace;letter-spacing:.6px;
              text-transform:uppercase;color:var(--faint)}
.drawer .dbody{padding:12px 20px 20px;overflow-y:auto}
.ev{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ev .en{font:500 13px "Geist Mono",monospace;word-break:break-all}
.ev .ei{font-size:12px;color:var(--indigo-deep);margin-top:3px}
.ev .eq{font-size:12.5px;color:var(--stone);margin-top:6px;border-left:2px solid var(--litline);
        padding-left:9px;line-height:1.5}
.ev .es{font:500 9.5px "Geist Mono",monospace;color:var(--faint);margin-top:7px;
        text-transform:uppercase;letter-spacing:.6px}
/* presentation mode */
body.present header,body.present .band.herob,body.present footer{display:none}
body.present .col{max-width:1220px}
body.present .viewhead h2{font-size:30px}
body.present .kpi .n{font-size:32px}
.pbar{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;
      background:#0c0a09;color:#fff;border-radius:10px;padding:10px 16px;
      font:500 12px "Geist Mono",monospace;gap:14px;align-items:center}
body.present .pbar{display:flex}
.pbar .pd{width:7px;height:7px;border-radius:50%;background:#57534e;cursor:pointer}
.pbar .pd.on{background:var(--orange)}
.pbar .pk{cursor:pointer;color:#a8a29e;user-select:none}
.pbar .pk:hover{color:#fff}
/* mobile: desktop-only, say so */
.mobilegate{display:none}
@media(max-width:767px){
  header,.band,footer,.pbar,.drawer,.scrim{display:none!important}
  .mobilegate{display:flex;position:fixed;inset:0;z-index:99;background:var(--bg);
    background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);
    background-size:14px 14px;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:36px;gap:14px}
  .mobilegate img{height:26px}
  .mobilegate .m1{font:500 13px "Geist Mono",monospace;letter-spacing:1px;
    text-transform:uppercase;color:var(--orange)}
  .mobilegate .m2{font-size:15px;color:var(--stone);max-width:30ch}
}
@page{size:A4 landscape;margin:11mm}
@media print{
  html,body{overflow-x:hidden!important;width:100%!important}
  header .right,.askwrap,.pbar,.scrim,.drawer,.hs,.mobilegate{display:none!important}
  body{background:#fff!important;background-image:none!important;color:#0c0a09!important;
       font-size:11px}
  header{position:static!important;background:#fff!important;backdrop-filter:none!important;
         border-bottom:1px solid #ddd;margin-bottom:10px}
  .tb{max-width:100%!important;padding:0 0 7px!important}
  .logoimg{height:17px}
  .band,.band+.band{border:none!important;margin:0!important}
  .col{max-width:100%!important;border:none!important;padding:0!important;background:#fff!important}
  .col::before,.col::after{display:none}
  .hero{max-width:100%;margin-bottom:9px}
  h1{font-size:21px;letter-spacing:-.4px;margin-bottom:6px}
  .kick{margin-bottom:6px;font-size:9px}
  .viewhead{margin:0 0 8px}.viewhead h2{font-size:14px}
  /* animated-in elements must never print invisible */
  .kpi,.row,.insight,.duel,#stage{opacity:1!important;transform:none!important;
       transition:none!important}
  .kpis{gap:7px;margin-bottom:9px}
  .kpi{padding:9px 11px 8px;box-shadow:none!important;border-color:#ddd!important}
  .kpi .n{font-size:16px}.kpi .l{font-size:8px}
  .grid{gap:7px}
  .panel{padding:11px 13px;box-shadow:none!important;border-color:#ddd!important}
  .row{margin-bottom:5px;grid-template-columns:14px 118px 1fr 34px}
  .row .c,.row .v{font-size:10px}
  .insight{padding:10px 13px;background:#fafafa!important;border-color:#ddd!important}
  .kpi,.panel,.insight,.duel{break-inside:avoid}
  footer{padding:10px 0 0;font-size:8.5px;color:#666}
}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid,.duelwrap{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
  .kpi,.row,.insight,.duel{opacity:1!important;transform:none!important;transition:none!important}
  #stage{transition:none}.status .cursor::after{animation:none}}
</style>
</head>

function rowsHTML(mode){
  const bar=(side,title,sub,hsNote)=>{
    const items=CATS.filter(c=>c.side===side).map((c,ix)=>{
      const zero=c.total===0;
      let cls="row"+(zero?" zero":"");
      if(mode==="zeros"){cls+=zero?" lit":(c.side==="whitespace"&&c.older===0?" lit2":" fade");}
      if(mode==="older") cls+=c.older>0?"":" fade";
      if(mode==="kids") cls+=c.kids>0?"":" fade";
      return '<div class="'+cls+'" data-c="'+c.id+'">'+
        '<div class="node" style="background:'+NODEC[ix%4]+'"></div>'+
        '<div class="c">'+esc(c.name)+"</div>"+
        '<div class="t">'+
        (c.older?'<div class="a" style="width:'+(c.older/MAXT*100)+'%"></div>':"")+
        (c.kids?'<div class="k" style="width:'+(c.kids/MAXT*100)+'%"></div>':"")+
        '</div><div class="v">'+(c.total||0)+"</div></div>";}).join("");
    return '<div class="panel"><h3>'+esc(title)+' <span>&middot; '+esc(sub)+"</span>"+
      (hsNote?'<span class="hs" data-note="'+esc(hsNote)+'">+</span>':"")+"</h3>"+items+"</div>";};
  const mixRows=CATS.filter(c=>c.side==="mixed").map(c=>
    '<div class="row in mixrow" data-c="'+c.id+'">'+
    '<div class="node" style="background:'+NODEC[3]+'"></div>'+
    '<div class="c">'+esc(c.name)+"</div>"+
    '<div class="t">'+
    (c.older?'<div class="a" style="width:'+(c.older/MAXT*100)+'%"></div>':"")+
    (c.kids?'<div class="k" style="width:'+(c.kids/MAXT*100)+'%"></div>':"")+
    '</div><div class="v">'+(c.total||0)+"</div></div>").join("");
  return '<div class="grid">'+
    bar("occupied","Where StudioCanal operates today","est. licensee brands",null)+
    bar("whitespace","The open categories","no StudioCanal licensee",null)+
    "</div>"+
    '<div class="panel mixband"><h3>Reported separately <span>&middot; sits in both camps</span>'+
    '<span class="hs" data-note="'+esc(DATA.meta.seasonalNote)+'">+</span></h3>'+mixRows+"</div>"+
    '<div class="legend"><span><i style="background:var(--blue);opacity:.85"></i>Older audience</span>'+
    '<span><i style="background:var(--bl100)"></i>Kids &amp; family</span></div>';
}

    '<div class="dv">'+c.total+' <span style="font-size:14px;color:var(--faint)">est. brands ('+c.lo+"-"+c.hi+")</span></div>"+
    '<div class="db">'+(c.older?'<div class="a" style="width:'+(c.older/MAXT*100)+'%"></div>':"")+
    (c.kids?'<div class="k" style="width:'+(c.kids/MAXT*100)+'%"></div>':"")+"</div>"+
    '<div class="note">'+esc(c.blurb)+" Click this card for the names and the exact licence wording.</div></div></div>";
}
function render(view){
  let v;
  if(view==="compare"&&compare){
    v={h:compare[0].name+" against "+compare[1].name,pill:"compare",done:"the comparison",
       k:[[String(compare[0].total),compare[0].name,1,compare[0].prov],
          [String(compare[1].total),compare[1].name,0,compare[1].prov],
          [compare[0].older+" / "+compare[1].older,"older audience",0,DATA.prov.older],
          [compare[0].kids+" / "+compare[1].kids,"kids & family",0,DATA.prov.kids]],
       it:"Side by side",ib:"Estimated licensee brands in each, split by audience. Click either card for the names behind it."};
    $("main").innerHTML=duelHTML(compare[0],compare[1]);
  } else if(view==="focus"&&focusCat){
    const c=focusCat;
    v={h:c.name+" up close",pill:"focus",done:c.name,
       k:[[String(c.total),"est. brands",1,c.prov],[String(c.older),"older audience",0,DATA.prov.older],
          [String(c.kids),"kids & family",0,DATA.prov.kids],[c.n.toLocaleString(),"stores sampled",0,DATA.prov.sample]],
       it:c.name,ib:c.blurb};
    $("main").innerHTML=focusHTML(c);
  } else {
    v=DATA.views[view]||DATA.views.overview;
    $("main").innerHTML=rowsHTML(v.mode);
  }
  $("h1").textContent=v.h; $("vp").textContent=v.pill;
  $("kpis").innerHTML=v.k.map(x=>
    '<div class="kpi'+(x[2]?" hot":"")+'"'+(x[3]?' data-prov="'+esc(x[3])+'"':"")+
    '><div class="n">'+esc(x[0])+'</div><div class="l">'+esc(x[1])+"</div></div>").join("");
  $("it").textContent=v.it; $("ib").textContent=v.ib;
  $("ins").classList.remove("in");
  stagger(".kpi"); stagger(".row"); stagger(".duel");
  setTimeout(()=>$("ins").classList.add("in"),300);
  current=view; try{history.replaceState(null,"","#"+(view==="focus"?focusCat.id:view));}catch(e){}
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches)
    document.querySelectorAll(".kpi .n").forEach(scramble);
  if(document.body.classList.contains("present")) drawDots();
  return v;
}
function stagger(sel){document.querySelectorAll(sel).forEach((e,i)=>{
  setTimeout(()=>e.classList.add("in"),40+i*36);});}
const DIGITS="0123456789";
function scramble(el){const fin=el.textContent;let f=0;const n=Math.max(8,fin.length*3);
  const t=setInterval(()=>{f++;
    el.textContent=fin.split("").map((c,i)=>(/[0-9]/.test(c)&&f<n-i*2)?DIGITS[Math.random()*10|0]:c).join("");
    if(f>=n){el.textContent=fin;clearInterval(t);}},32);}
function findCat(q){
  for(const c of CATS){
    for(const al of c.aliases) if(q.includes(al)) return c;
    for(const tok of q.split(/\s+/))
      if(tok.length>3&&c.aliases.some(al=>al.startsWith(tok.slice(0,4)))) return c;
  }
  return null;
}
const INTENTS=[
 ["gaps",   /gap|open|empt|white ?space|ground|nothing|zero|missing|vacan|unclaimed|untouched|blank/],
 ["market", /market|big|size|total|whole|overall|worth|scale|how many|altogether|penetration/],
 ["olderonly",/(older|grown|cult|classic)[a-z ]*(only|just|side|alone)|(only|just) [a-z ]*(older|grown|cult)/],
 ["kidsonly",/(kid|family|child|pre.?school)[a-z ]*(only|just|side|alone)|(only|just) [a-z ]*(kid|child|family)/],
 ["split",  /split|audience|both sides|breakdown|divide|mix|kids|family|older|child/],
 ["method", /check|trust|method|proof|verif|how do you know|source|sure|accurate|reliab|believ/],
 ["overview",/full|everything|overview|reset|start|all of it|whole report|home/]
];
function route(q){
  q=q.toLowerCase().replace(/[?!.,;:]/g," ").replace(/\s+/g," ").trim();
  if(q==="help"||q==="what can i ask") return "help";
  const m=q.match(/([a-z& ]+?)\s+(?:vs|v|against|versus)\.?\s+([a-z& ]+)/);
  if(m){const a=findCat(m[1].trim()),b=findCat(m[2].trim());
    if(a&&b&&a!==b){compare=[a,b];return"compare";}}
  const cat=findCat(q);
  if(cat&&!/gap|market|audience|split|check|trust/.test(q)){focusCat=cat;return"focus";}
  for(const [view,rx] of INTENTS) if(rx.test(q)) return view;
  return null;
}
let busy=false;
function typeOut(el,txt,cb){let i=0;el.innerHTML='<span class="cursor"></span>';
  const span=document.createElement("span");el.prepend(span);
  const t=setInterval(()=>{span.textContent=txt.slice(0,++i);
    if(i>=txt.length){clearInterval(t);cb&&cb();}},14);}
function go(){if(busy)return;
  const q=$("q").value.trim(); if(!q)return;
  tourStop(); const view=route(q);
  if(view==="help"){
    $("status").innerHTML='<span class="ok">&#9656;</span> try: a category name, "toys vs games", '+
      '"where is the gap", "older side only", "market size", "how was this checked"';
    return;}
  if(view===null){
    $("status").innerHTML='not sure what you mean - try "'+
      DATA.meta.suggest[Math.floor(Math.random()*DATA.meta.suggest.length)]+'" or type help';
    return;}
  busy=true;
  const label=view==="compare"?"compare":view==="focus"?"focus":(DATA.views[view]||DATA.views.overview).pill;
  $("gobtn").disabled=true; $("gobtn").textContent="working";
  $("sweep").classList.remove("go"); void $("sweep").offsetWidth; $("sweep").classList.add("go");
  typeOut($("status"),"$ composing "+label+" view ...");
  setTimeout(()=>{$("stage").classList.add("out");},260);
  setTimeout(()=>{const v=render(view); $("stage").classList.remove("out");
    $("status").innerHTML='<span class="ok">&#10003;</span> done - showing '+v.done;
    $("gobtn").disabled=false; $("gobtn").textContent="Show me";
    $("sweep").classList.remove("go"); busy=false;},560);}
function ask(t){$("q").value=t;go();}
function swapTo(view){$("stage").classList.add("out");
  setTimeout(()=>{render(view);$("stage").classList.remove("out");},160);}
function reset(){tourStop();$("q").value="";$("status").textContent="";swapTo("overview");}

function openDrawer(catId){
  const c=CATS.find(x=>x.id===catId); if(!c)return;
  $("dcat").textContent=c.name;
  $("dbody").innerHTML=(c.ev.length?c.ev.map(e=>'<div class="ev"><div class="en">'+esc(e.d)+"</div>"+
      '<div class="ei">'+esc(e.ip)+"</div>"+
      '<div class="eq">&ldquo;'+esc(e.q)+'&rdquo;</div>'+
      '<div class="es">'+esc(e.s)+"</div></div>").join("")
    :'<div class="ev"><div class="eq">'+esc(c.zeroNote||"No licensee found in this category.")+"</div></div>")+
    '<div class="es" style="padding:6px 2px;color:var(--faint)">'+esc(DATA.meta.drawerFoot)+"</div>";
  $("drawer").classList.add("open");$("scrim").classList.add("on");}
function closeDrawer(){$("drawer").classList.remove("open");$("scrim").classList.remove("on");}
$("stage").addEventListener("click",e=>{const r=e.target.closest("[data-c]");
  if(r&&r.dataset.c&&!document.body.classList.contains("present"))openDrawer(r.dataset.c);});

const ORDER=["overview","gaps","market","split","method"];let pi=0;
function drawDots(){$("pdots").innerHTML=ORDER.map((v,i)=>
  '<span class="pd'+(i===pi?" on":"")+'" onclick="pGo('+i+')"></span>').join("");}
function pGo(i){pi=(i+ORDER.length)%ORDER.length;swapTo(ORDER[pi]);}
function pNext(){pGo(pi+1);} function pPrev(){pGo(pi-1);}
function presentOn(){tourStop();closeDrawer();document.body.classList.add("present");
  pi=Math.max(0,ORDER.indexOf(current));drawDots();window.scrollTo({top:0});}
function presentOff(){document.body.classList.remove("present");}
document.addEventListener("keydown",e=>{
  if(document.body.classList.contains("present")){
    if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();pNext();}
    if(e.key==="ArrowLeft")pPrev();
    if(e.key==="Escape")presentOff();
  } else if(e.key==="Escape"){closeDrawer();tourStop();}});
document.addEventListener("keydown",e=>{
  if(document.activeElement===$("q")) return;
  if(e.key==="/"||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k")){
    e.preventDefault();$("q").focus();}});

// rotating placeholder: types a question, holds, deletes, moves on.
// stops the moment the box is focused or has text.
let phraseT=null;
function phraseStart(){
  if(phraseT||$("q").value) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    $("q").placeholder=DATA.meta.phrases[0]; return;}
  let pi=0,ci=0,del=false;
  phraseT=setInterval(()=>{
    const p=DATA.meta.phrases[pi];
    ci+=del?-1:1;
    $("q").placeholder=p.slice(0,ci);
    if(!del&&ci===p.length){del=true;clearInterval(phraseT);
      phraseT=setTimeout(()=>{phraseT=null;phraseResume(pi,true);},1500);}
    else if(del&&ci===0){del=false;pi=(pi+1)%DATA.meta.phrases.length;}
  },45);
}
function phraseResume(pi,del){
  let ci=DATA.meta.phrases[pi].length;
  phraseT=setInterval(()=>{
    ci--;$("q").placeholder=DATA.meta.phrases[pi].slice(0,ci);
    if(ci<=0){clearInterval(phraseT);phraseT=null;
      const next=(pi+1)%DATA.meta.phrases.length;phraseTypeNext(next);}
  },28);
}
function phraseTypeNext(pi){
  let ci=0;const p=DATA.meta.phrases[pi];
  phraseT=setInterval(()=>{
    ci++;$("q").placeholder=p.slice(0,ci);
    if(ci>=p.length){clearInterval(phraseT);
      phraseT=setTimeout(()=>{phraseT=null;phraseResume(pi,true);},1500);}
  },45);
}
function phraseStop(){if(phraseT){clearInterval(phraseT);clearTimeout(phraseT);phraseT=null;}
  $("q").placeholder="";}

let tourTimers=[];
function tour(){tourStop();
  DATA.meta.tour.forEach((s,i)=>{tourTimers.push(setTimeout(()=>{swapTo(s[0]);
    setTimeout(()=>{$("status").innerHTML='<span class="ok">&#9656;</span> '+esc(s[1]);},220);},i*3000));});
  tourTimers.push(setTimeout(()=>{$("status").innerHTML='<span class="ok">&#10003;</span> that is the tour - ask for anything else';},DATA.meta.tour.length*3000));}
function tourStop(){tourTimers.forEach(clearTimeout);tourTimers=[];}

phraseStart();
const h=location.hash.replace("#","");
const hc=CATS.find(c=>c.id===h);
if(hc){focusCat=hc;render("focus");}else{render(DATA.views[h]?h:"overview");}
</script>
</body>
</html>
